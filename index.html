<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" id="appleTouchIcon">
  <title>Habit Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* tweakcn / shadcn "slate" preset — light */
      --bg: oklch(0.987 0.002 197.1);
      --bg-card: oklch(1 0 0);
      --text: oklch(0.148 0.004 228.8);
      --text-secondary: oklch(0.56 0.021 213.5);
      --accent: oklch(0.218 0.008 223.9);
      --accent-light: oklch(0.963 0.002 197.1);
      --accent-foreground: oklch(0.987 0.002 197.1);
      --success: #34c759;
      --success-light: #e8f9ee;
      --danger: oklch(0.577 0.245 27.325);
      --danger-light: oklch(0.95 0.03 27);
      --border: oklch(0.925 0.005 214.3);
      --ring: oklch(0.723 0.014 214.4);
      --shadow: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 1px 2px -1px hsl(0 0% 0% / 0.10);
      --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 4px 6px -1px hsl(0 0% 0% / 0.10);
      --radius: 10px;
      --radius-sm: 6px;
    }

    [data-theme="dark"] {
      /* tweakcn / shadcn "slate" preset — dark */
      --bg: oklch(0.148 0.004 228.8);
      --bg-card: oklch(0.218 0.008 223.9);
      --text: oklch(0.987 0.002 197.1);
      --text-secondary: oklch(0.723 0.014 214.4);
      --accent: oklch(0.925 0.005 214.3);
      --accent-light: oklch(0.275 0.011 216.9);
      --accent-foreground: oklch(0.218 0.008 223.9);
      --success: #30d158;
      --success-light: #1a3a2a;
      --danger: oklch(0.704 0.191 22.216);
      --danger-light: oklch(0.32 0.08 22);
      --border: oklch(1 0 0 / 10%);
      --ring: oklch(0.56 0.021 213.5);
      --shadow: 0 1px 3px 0px hsl(0 0% 0% / 0.30), 0 1px 2px -1px hsl(0 0% 0% / 0.30);
      --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.40), 0 4px 6px -1px hsl(0 0% 0% / 0.40);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    header .tab-bar {
      flex: 1;
      margin-bottom: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg-card);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 18px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .icon-btn:hover {
      transform: scale(1.08);
      box-shadow: var(--shadow-lg);
    }

    /* Date navigation */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .date-nav button {
      border: none;
      background: var(--bg-card);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }

    .date-nav button:hover { transform: scale(1.1); }

    .date-nav .date-label {
      font-size: 16px;
      font-weight: 600;
      min-width: 180px;
      text-align: center;
    }

    .date-nav .today-tag {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      text-align: center;
    }

    /* Week strip */
    .week-strip {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .week-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      min-width: 44px;
    }

    .week-day:hover { background: var(--bg-card); }

    .week-day.active {
      background: var(--accent);
      color: white;
    }

    .week-day .day-name {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .week-day.active .day-name { opacity: 1; }

    .week-day .day-num {
      font-size: 16px;
      font-weight: 600;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 14px 14px 20px;
      box-shadow: var(--shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 76px;
    }

    .stat-card .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Progress bar under daily % — absolute so it doesn't push content around */
    .progress-bar-bg {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* Add habit */
    .add-section {
      margin-top: 8px;
    }

    .add-btn {
      width: 100%;
      padding: 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      font-size: 15px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-weight: 500;
    }

    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .add-form {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-lg);
      display: none;
    }

    .add-form.visible { display: block; }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-row {
      margin-bottom: 12px;
    }

    .form-row-inline {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-row-inline .form-row {
      margin-bottom: 0;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: white;
      flex: 1;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    /* Habit list */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .habit-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .habit-check {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
      background: transparent;
      color: transparent;
    }

    .habit-check:hover {
      border-color: var(--success);
      background: var(--success-light);
    }

    .habit-check.checked {
      border-color: var(--success);
      background: var(--success);
      color: white;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .habit-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .habit-info {
      flex: 1;
      min-width: 0;
    }

    .habit-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .habit-streak-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .habit-streak-badge .fire, .habit-meta .fire { color: #ff9500; }

    .habit-month-pct {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-light);
      color: var(--accent);
      flex-shrink: 0;
    }

    .habit-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .habit-card:hover .habit-actions { opacity: 1; }

    .habit-actions button {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .habit-actions button:hover { color: var(--danger); }

    /* Streak dots */
    .streak-dots {
      display: flex;
      gap: 2px;
    }

    .streak-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
    }

    .streak-dot.done { background: var(--success); }


    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    /* Tab bar */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 3px;
      box-shadow: var(--shadow);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    /* Month navigation */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .month-nav button {
      border: none;
      background: var(--bg-card);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }

    .month-nav button:hover { transform: scale(1.1); }

    .month-label {
      font-size: 16px;
      font-weight: 600;
      min-width: 180px;
      text-align: center;
    }

    /* Calendar grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 20px;
    }

    .cal-header {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding: 8px 0;
    }

    .cal-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-height: 48px;
      background: var(--bg-card);
    }

    .cal-cell:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    .cal-cell.empty {
      cursor: default;
      background: transparent;
    }

    .cal-cell.empty:hover {
      transform: none;
      box-shadow: none;
    }

    .cal-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .cal-cell.future {
      opacity: 0.4;
      cursor: default;
    }

    .cal-cell.future:hover {
      transform: none;
      box-shadow: none;
    }

    .cal-day-num {
      font-size: 13px;
      font-weight: 600;
    }

    .cal-pct {
      font-size: 10px;
      font-weight: 700;
      margin-top: 1px;
    }

    .cal-tags {
      display: flex;
      gap: 1px;
      margin-top: 1px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
      overflow: hidden;
    }

    .cal-tags .cal-tag-emoji {
      font-size: 8px;
      line-height: 1;
    }

    .month-summary {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .month-summary .summary-value {
      font-size: 28px;
      font-weight: 700;
    }

    .month-summary .summary-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Year view */
    .year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .year-nav button {
      border: none;
      background: var(--bg-card);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }

    .year-nav button:hover { transform: scale(1.1); }

    .year-label {
      font-size: 16px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .year-month-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 14px 12px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .year-month-card:hover {
      transform: scale(1.03);
      box-shadow: var(--shadow-lg);
    }

    .year-month-card.future {
      opacity: 0.4;
      cursor: default;
    }

    .year-month-card.future:hover {
      transform: none;
      box-shadow: none;
    }

    .year-month-card.current {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .year-month-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .year-month-pct {
      font-size: 24px;
      font-weight: 700;
    }

    .year-month-tags {
      display: flex;
      gap: 2px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 12px;
      line-height: 1;
    }

    .year-month-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .year-month-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* Habit year stats list */
    .year-habits-section {
      margin-top: 24px;
    }

    .year-habits-section h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .year-habit-row {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .year-habit-row .habit-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .year-habit-row .habit-name {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .year-habit-row .year-habit-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .year-habit-row .year-habit-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .year-habit-row .year-habit-pct {
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 44px;
      text-align: center;
    }

    .year-summary {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 24px;
    }

    .year-summary .summary-value {
      font-size: 28px;
      font-weight: 700;
    }

    .year-summary .summary-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Day tags */
    .day-tags-section {
      margin-top: 16px;
    }

    .day-tags-display {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .day-tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      animation: slideIn 0.2s ease-out;
    }

    .day-tag-chip.trip {
      background: #e0f0ff;
      color: #0060b0;
    }

    .day-tag-chip.event {
      background: #fff3e0;
      color: #b06000;
    }

    .day-tag-chip.person {
      background: #f0e8ff;
      color: #6020b0;
    }

    .day-tag-chip.sick {
      background: #fce4ec;
      color: #b01030;
    }

    [data-theme="dark"] .day-tag-chip.trip {
      background: #102840;
      color: #60b0ff;
    }

    [data-theme="dark"] .day-tag-chip.event {
      background: #402810;
      color: #ffb060;
    }

    [data-theme="dark"] .day-tag-chip.person {
      background: #281040;
      color: #b080ff;
    }

    [data-theme="dark"] .day-tag-chip.sick {
      background: #401018;
      color: #ff8090;
    }

    .day-tag-chip .tag-remove {
      cursor: pointer;
      opacity: 0.5;
      font-size: 12px;
      margin-left: 2px;
      border: none;
      background: none;
      color: inherit;
      padding: 0 2px;
      line-height: 1;
    }

    .day-tag-chip .tag-remove:hover {
      opacity: 1;
    }

    .tag-buttons {
      display: flex;
      gap: 6px;
    }

    .tag-add-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      box-shadow: var(--shadow);
    }

    .tag-add-btn:hover {
      border-color: var(--accent);
    }

    .tag-input-row {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      animation: slideIn 0.2s ease-out;
    }

    .tag-input-row.visible {
      display: flex;
    }

    .tag-input-row .tag-type-badge {
      font-size: 18px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      padding: 2px 4px;

    .tag-input-row .tag-type-badge:hover {

    .tag-emoji-input {
      width: 36px;

    /* Mini tags in date nav */

    [data-theme="dark"] .date-nav-tags .mini-tag.trip {
      background: #102840;
      color: #60b0ff;
    }

    [data-theme="dark"] .date-nav-tags .mini-tag.event {
      background: #402810;
      color: #ffb060;
    }

    [data-theme="dark"] .date-nav-tags .mini-tag.person {

      color: #b080ff;
    }

    [data-theme="dark"] .date-nav-tags .mini-tag.sick {
      background: #401018;
      color: #ff8090;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 16px 12px; }
      header h1 { font-size: 24px; }
      .week-day { padding: 6px 6px; min-width: 38px; }
      .stats-bar { gap: 8px; }
      .stat-card { padding: 10px; }
      .stat-card .stat-value { font-size: 20px; }
      .habit-actions { opacity: 1; }
      .cal-cell { min-height: 40px; }
      .cal-day-num { font-size: 12px; }
      .cal-pct { font-size: 9px; }
    }

    /* Confetti */
    .confetti-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confettiFall var(--fall-duration) var(--fall-delay) ease-in forwards;
    }
    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(var(--fall-distance)) rotate(var(--spin)) scale(0.5);
        opacity: 0;
      }
    }
    .auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;

    .auth-screen.visible { display: flex; }
    .auth-box {
      background: var(--bg-card);

    .auth-message.success { color: var(--success); }
    .container.hidden { visibility: hidden; }
  </style>
</head>
<body>

  <script>
    // --- Default habits ---
    // schedule.days = array of JS weekdays (0=Sun,1=Mon,...6=Sat), null=every day
    // schedule.months = array of months (0=Jan,...11=Dec), null=every month
    const DEFAULT_HABITS = [
      { icon: '❄️', name: 'Eisbaden / Kryo', schedule: { days: [0], months: [10, 11, 0, 1] } },
      { icon: '🧖‍♂️', name: 'Sauna', schedule: { days: [0], months: null } },
      { icon: '🌅', name: '06:00 - 7:30', schedule: { days: [1,2,3,4,5], months: null } },
      { icon: '🧃', name: 'Creatin', schedule: null },
      { icon: '🏃', name: 'Cardio', schedule: { days: [6], months: null } },
      { icon: '🏋️', name: 'Strength', schedule: { days: [1,4], months: null } },
      { icon: '🇪🇸', name: '30min Spanisch', schedule: null },
      { icon: '🥊', name: 'Spitfire', schedule: { days: [2,3,5], months: null } },
      { icon: '🧘', name: 'Stretching', schedule: null },
      { icon: '🦷', name: 'Zähne putzen', schedule: null },
      { icon: '🧴', name: 'Skincare', schedule: null },
      { icon: '🛌', name: '00:00', schedule: { days: [0,1,2,3,4], months: null } },
      { icon: '📱', name: '< 1h social', schedule: { days: [1,2,3,4,5], months: null } },
      { icon: '🍸', name: 'nüchtern', schedule: null },
      { icon: '🚭', name: 'no smoke', schedule: null },
      { icon: '🔞', name: 'no porn', schedule: null },
    ];

    // --- Supabase config ---
    const SUPABASE_URL = 'https://kplefxmvamdxjhnpbdhk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dzePEP00U_AiYNlOcKwXQg_FXvd7nns';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    let currentUser = null;
    let cloudSaveTimer = null;

    // --- State ---
    const STORAGE_KEY = 'habitTracker';

    let state = loadState();
    let selectedDate = todayStr();
    let editingId = null;
    let currentTab = 'today';
    let overviewMonth = null;
    let overviewYear = null;

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(dateStr) {
      const d = parseDate(dateStr);
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    function dateAdd(dateStr, days) {
      const d = parseDate(dateStr);
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (!s.comments) s.comments = {};
          if (!s.dayTags) s.dayTags = {};
          if (s.hidePorn === undefined) s.hidePorn = false;
          return s;
        }
      } catch (e) {}
      // First load: seed with default habits
      const habits = DEFAULT_HABITS.map((h, i) => ({
        id: 'h' + i + '_' + Date.now().toString(36),
        icon: h.icon,
        name: h.name,
        schedule: h.schedule || null,
      }));
      return { habits, completions: {}, comments: {}, dayTags: {}, theme: 'light', hidePorn: false };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      scheduleCloudSave();
    }

    function scheduleCloudSave() {
      if (!currentUser) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(pushToCloud, 800);
    }

    async function pushToCloud() {
      if (!currentUser) return;
      try {
        const { error } = await sb
          .from('user_state')
          .upsert({ user_id: currentUser.id, state, updated_at: new Date().toISOString() });
        if (error) console.error('Cloud save failed:', error);
      } catch (e) {
        console.error('Cloud save threw:', e);
      }
    }

    function normalizeState(s) {
      if (!s || typeof s !== 'object') return null;
      if (!Array.isArray(s.habits)) return null;
      if (!s.completions) s.completions = {};
      if (!s.comments) s.comments = {};
      if (!s.dayTags) s.dayTags = {};
      if (s.hidePorn === undefined) s.hidePorn = false;
      if (!s.theme) s.theme = 'light';
      return s;
    }

    async function loadFromCloud() {
      let cloudState = null;
      try {
        const { data, error } = await sb
          .from('user_state')
          .select('state')
          .eq('user_id', currentUser.id)
          .maybeSingle();
        if (error) throw error;
        cloudState = normalizeState(data?.state);
      } catch (e) {
        console.error('Cloud load failed, using local:', e);
        return; // keep the localStorage-seeded state
      }

      const localState = state; // already loaded from localStorage
      const localHasData = Object.keys(localState.completions || {}).length > 0;

      if (cloudState && localHasData) {
        const alreadySynced = localStorage.getItem('cloudSyncedFor') === currentUser.id;
        if (alreadySynced) {
          state = cloudState;
        } else {
          const cloudDays = Object.keys(cloudState.completions || {}).length;
          const localDays = Object.keys(localState.completions).length;
          const useLocal = confirm(
            `Cloud: ${cloudState.habits.length} habits, ${cloudDays} entries.\n` +
            `This device: ${localState.habits.length} habits, ${localDays} entries.\n\n` +
            `OK  = upload this device's data (overwrites cloud)\n` +
            `Cancel = use cloud data (overwrites this device)`
          );
          if (useLocal) {
            await pushToCloud();
          } else {
            state = cloudState;
          }
        }
      } else if (cloudState) {
        state = cloudState;
      } else {
        // Cloud empty — push local up (whether it has real data or just seeded defaults)
        await pushToCloud();
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.setItem('cloudSyncedFor', currentUser.id);
    }

    function showAuthScreen() {
      const screen = document.getElementById('authScreen');
      screen.classList.add('visible');
      const emailInput = document.getElementById('authEmail');
      const btn = document.getElementById('authSendLink');
      const msg = document.getElementById('authMessage');

      // Show local data count + backup button on the auth screen
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const info = document.getElementById('authLocalCount');
        const backupBtn = document.getElementById('authBackupLocal');
        if (raw) {
          const parsed = JSON.parse(raw);
          const habits = (parsed.habits || []).length;
          const entries = Object.keys(parsed.completions || {}).length;
          info.textContent = `This device: ${habits} habits, ${entries} entries.`;
          backupBtn.onclick = () => {
            const blob = new Blob(
              [JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), state: parsed }, null, 2)],
              { type: 'application/json' }
            );
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            const d = new Date();
            const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            a.download = `habits-backup-${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            alert(`${entries} entries exported. Save this file somewhere safe (iCloud Drive).`);
          };
        } else {
          document.getElementById('authLocalInfo').style.display = 'none';
        }
      } catch (e) {
        document.getElementById('authLocalInfo').style.display = 'none';
      }

      const send = async () => {
        const email = emailInput.value.trim();
        msg.className = 'auth-message';
        msg.textContent = '';
        if (!email || !email.includes('@')) {
          msg.textContent = 'Enter a valid email.';
          msg.className = 'auth-message error';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const { error } = await sb.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.origin + window.location.pathname }
          });
          if (error) throw error;
          msg.textContent = 'Check your email for the sign-in link.';
          msg.className = 'auth-message success';
        } catch (e) {
          msg.textContent = e.message || 'Something went wrong.';
          msg.className = 'auth-message error';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send magic link';
        }
      };

      btn.onclick = send;
      emailInput.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    }

    async function bootstrap() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        showAuthScreen();
        return;
      }
      currentUser = session.user;
      await loadFromCloud();
      document.querySelector('.container').classList.remove('hidden');
      init();
    }

    async function doSignOut() {
      try { await sb.auth.signOut(); } catch (e) {}
      localStorage.removeItem('cloudSyncedFor');
      location.reload();
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // --- Migrate existing habits to include schedules ---
    (function migrateSchedules() {
      const scheduleMap = {};
      for (const dh of DEFAULT_HABITS) {
        scheduleMap[dh.name] = dh.schedule || null;
      }
      for (const h of state.habits) {
        if (h.schedule === undefined) {
          h.schedule = scheduleMap[h.name] || null;
        }
      }
      saveState();
    })();

    // --- Migrate: add 🔞 no porn if missing ---
    (function migrateNoPorn() {
      if (!state.habits.find(h => h.name === 'no porn')) {
        state.habits.push({
          id: 'h15_' + Date.now().toString(36),
          icon: '🔞',
          name: 'no porn',
          schedule: null,
        });
        saveState();
      }
    })();

    // --- One-time import: Jan/Feb/Mar 2026 data from Google Sheets CSV ---
    (function importQ1_2026() {
      if (localStorage.getItem('q1_2026_imported')) return;

      const nameToId = {};
      for (const h of state.habits) nameToId[h.name] = h.id;

      // n=null (not applicable), t=true, f=false
      const t = true, f = false, n = null;

      const months = [
        { year: 2026, month: 1, days: 31, data: {

    // --- Calendar / Overview ---
    function pctToColor(pct) {
      const hue = (pct / 100) * 120;
      const sat = 65;
      const bg_l = state.theme === 'dark' ? 25 : 88;
      const txt_l = state.theme === 'dark' ? 85 : 25;
      return {
        bg: `hsl(${hue}, ${sat}%, ${bg_l}%)`,
        text: `hsl(${hue}, ${sat}%, ${txt_l}%)`
      };
    }

    function initOverviewMonth() {
      const d = parseDate(selectedDate);
      overviewMonth = { year: d.getFullYear(), month: d.getMonth() };
    }

    function renderCalendar() {
      if (!overviewMonth) initOverviewMonth();
      const { year, month } = overviewMonth;

      document.getElementById('monthLabel').textContent =
        new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      for (const name of dayNames) {
        const el = document.createElement('div');
        el.className = 'cal-header';
        el.textContent = name;
        grid.appendChild(el);
      }

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDow = (firstDay.getDay() + 6) % 7;
      const todayString = todayStr();
      const todayDate = parseDate(todayString);

      for (let i = 0; i < startDow; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cellDate = parseDate(ds);
        const isFuture = cellDate > todayDate;
        const isToday = ds === todayString;

        const cell = document.createElement('div');
        cell.className = 'cal-cell' + (isToday ? ' today' : '') + (isFuture ? ' future' : '');

        if (!isFuture) {
          const stats = getDailyStats(ds);
          if (stats.done > 0) {
            const c = pctToColor(stats.pct);
            cell.style.background = c.bg;
            cell.style.color = c.text;
          }
          const dayTags = getDayTags(ds);
          const tagsHtml = dayTags.length > 0
            ? `<span class="cal-tags">${dayTags.map(t => `<span class="cal-tag-emoji">${t.emoji}</span>`).join('')}</span>`
            : '';
          cell.innerHTML = `<span class="cal-day-num">${day}</span><span class="cal-pct">${stats.pct}%</span>${tagsHtml}`;
          cell.onclick = () => { selectedDate = ds; switchTab('today'); };

          cell.innerHTML = `<span class="cal-day-num">${day}</span>`;
        }

        grid.appendChild(cell);
      }

      const monthDs = `${year}-${String(month + 1).padStart(2, '0')}-01`;
      const monthlyPct = getOverallMonthlyPct(monthDs);
      document.getElementById('monthSummary').innerHTML = `
        <div class="summary-value">${monthlyPct}%</div>
        <div class="summary-label">Monthly Average</div>`;
    }

    // --- Year Overview ---
    function initOverviewYear() {
      overviewYear = parseDate(selectedDate).getFullYear();
    }

    function getMonthPct(year, month) {
      const today = new Date();
      const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
      const isFuture = new Date(year, month, 1) > today;
      if (isFuture) return { pct: 0, future: true };

      const daysInScope = isCurrentMonth ? today.getDate() : new Date(year, month + 1, 0).getDate();
      if (state.habits.length === 0 || daysInScope === 0) return { pct: 0, future: false };

      let totalApplicable = 0;
      let totalChecks = 0;
      for (let day = 1; day <= daysInScope; day++) {
        const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        for (const h of state.habits) {
          if (!isHabitVisible(h)) continue;
          if (!habitApplies(h, ds)) continue;
          totalApplicable++;
          if (state.completions[`${ds}_${h.id}`]) totalChecks++;
        }
      }
      return { pct: totalApplicable > 0 ? Math.round((totalChecks / totalApplicable) * 100) : 0, future: false };
    }

    function getYearPctForHabit(habitId, year) {
      const habit = state.habits.find(h => h.id === habitId);
      const today = new Date();
      let totalDays = 0;
      let doneDays = 0;

      for (let month = 0; month < 12; month++) {
        if (new Date(year, month, 1) > today) break;
        const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
        const daysInMonth = isCurrentMonth ? today.getDate() : new Date(year, month + 1, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          if (habit && !habitApplies(habit, ds)) continue;
          totalDays++;
          if (state.completions[`${ds}_${habitId}`]) doneDays++;
        }
      }
      return { done: doneDays, total: totalDays, pct: totalDays > 0 ? Math.round((doneDays / totalDays) * 100) : 0 };
    }

    function getOverallYearPct(year) {
      if (state.habits.length === 0) return 0;
      let totalApplicable = 0;
      let totalDone = 0;
      const today = new Date();

      for (let month = 0; month < 12; month++) {
        if (new Date(year, month, 1) > today) break;
        const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
        const daysInMonth = isCurrentMonth ? today.getDate() : new Date(year, month + 1, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          for (const h of state.habits) {
            if (!isHabitVisible(h)) continue;
            if (!habitApplies(h, ds)) continue;
            totalApplicable++;
            if (state.completions[`${ds}_${h.id}`]) totalDone++;
          }
        }
      }
      return totalApplicable > 0 ? Math.round((totalDone / totalApplicable) * 100) : 0;
    }

    function renderYear() {
      if (!overviewYear) initOverviewYear();
      const year = overviewYear;

      document.getElementById('yearLabel').textContent = year;

      // Year summary
      const yearPct = getOverallYearPct(year);
      document.getElementById('yearSummary').innerHTML = `
        <div class="summary-value">${yearPct}%</div>
        <div class="summary-label">Yearly Average</div>`;

      // Month grid
      const grid = document.getElementById('yearGrid');
      grid.innerHTML = '';
      const today = new Date();
      const currentMonth = today.getMonth();
      const currentYear = today.getFullYear();
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      for (let m = 0; m < 12; m++) {
        const { pct, future } = getMonthPct(year, m);
        const isCurrent = year === currentYear && m === currentMonth;

        const card = document.createElement('div');
        card.className = 'year-month-card' + (future ? ' future' : '') + (isCurrent ? ' current' : '');

        const c = !future && pct > 0 ? pctToColor(pct) : null;

        // Collect unique emojis from all day tags in this month
        const monthEmojis = [];
        if (!future) {
          const daysInMonth = new Date(year, m + 1, 0).getDate();
          const seen = new Set();
          for (let day = 1; day <= daysInMonth; day++) {
            const ds = `${year}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const tags = getDayTags(ds);
            for (const tag of tags) {
              const key = `${tag.emoji}${tag.text}`;
              if (!seen.has(key)) {
                seen.add(key);
                monthEmojis.push(tag.emoji);
              }
            }
          }
        }
        const emojisHtml = monthEmojis.length > 0
          ? `<div class="year-month-tags">${monthEmojis.map(e => `<span>${e}</span>`).join('')}</div>`
          : '';

        card.innerHTML = `
          <div class="year-month-name">${monthNames[m]}</div>
          <div class="year-month-pct" ${c ? `style="color:${c.text}"` : ''}>${future ? '—' : pct + '%'}</div>${emojisHtml}
          <div class="year-month-bar">
            <div class="year-month-bar-fill" style="width:${future ? 0 : pct}%; background:${c ? c.bg : 'var(--border)'}"></div>
          </div>`;

        if (!future) {
          card.onclick = () => {
            overviewMonth = { year, month: m };
            switchTab('overview');
          };
        }

        grid.appendChild(card);
      }

      // Habit stats list
      const list = document.getElementById('yearHabitsList');
      list.innerHTML = '';

      for (const habit of state.habits) {
        if (!isHabitVisible(habit)) continue;
        const stats = getYearPctForHabit(habit.id, year);
        const c = stats.pct > 0 ? pctToColor(stats.pct) : null;

        const row = document.createElement('div');
        row.className = 'year-habit-row';
        row.innerHTML = `
          <span class="habit-icon">${habit.icon}</span>
          <span class="habit-name">${escapeHtml(habit.name)}</span>
          <div class="year-habit-stats">
            <span class="year-habit-count">${stats.done}/${stats.total}d</span>
            <span class="year-habit-pct" style="background:${c ? c.bg : 'var(--accent-light)'}; color:${c ? c.text : 'var(--accent)'}">${stats.pct}%</span>
          </div>`;
        list.appendChild(row);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.getElementById('viewToday').style.display = tab === 'today' ? '' : 'none';
      document.getElementById('viewOverview').style.display = tab === 'overview' ? '' : 'none';
      document.getElementById('viewYear').style.display = tab === 'year' ? '' : 'none';
      if (tab === 'today') {
        render();
      } else if (tab === 'overview') {
        if (!overviewMonth) initOverviewMonth();
        renderCalendar();
      } else {
        if (!overviewYear) initOverviewYear();
        renderYear();
      }

    // --- Actions ---
    function launchConfetti() {
      const container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);

      const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6fc8','#845ef7','#ff922b','#20c997'];
      const shapes = ['circle','rect','triangle'];
      const count = 80;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const left = Math.random() * 100;
        const fallDuration = 1.5 + Math.random() * 2;
        const fallDelay = Math.random() * 0.5;
        const spin = (Math.random() - 0.5) * 1440;
        const size = 6 + Math.random() * 8;

        piece.style.left = left + '%';
        piece.style.width = size + 'px';
        piece.style.height = size + 'px';
        piece.style.setProperty('--fall-duration', fallDuration + 's');
        piece.style.setProperty('--fall-delay', fallDelay + 's');
        piece.style.setProperty('--fall-distance', (window.innerHeight + 20) + 'px');
        piece.style.setProperty('--spin', spin + 'deg');

        if (shape === 'circle') {
          piece.style.borderRadius = '50%';
          piece.style.background = color;
        } else if (shape === 'rect') {
          piece.style.background = color;
          piece.style.borderRadius = '2px';
          piece.style.height = (size * 0.6) + 'px';
        } else {
          piece.style.width = '0';
          piece.style.height = '0';
          piece.style.borderLeft = (size/2) + 'px solid transparent';
          piece.style.borderRight = (size/2) + 'px solid transparent';
          piece.style.borderBottom = size + 'px solid ' + color;
          piece.style.background = 'none';
        }

        container.appendChild(piece);
      }

      setTimeout(() => container.remove(), 4000);
    }

    function toggleHabit(id) {
      const key = `${selectedDate}_${id}`;
      if (state.completions[key]) {
        delete state.completions[key];
      } else {
        state.completions[key] = true;
      }
      saveState();
      render();

      // Check if day is now 100%
      if (state.completions[key]) {
        const stats = getDailyStats(selectedDate);
        if (stats.pct === 100) launchConfetti();
      }
    }

    function addHabit(icon, name) {
      state.habits.push({ id: generateId(), icon, name });
      saveState();
      render();
    }

    function deleteHabit(id) {
      if (!confirm('Delete this habit? This will remove all its history.')) return;
      state.habits = state.habits.filter(h => h.id !== id);
      for (const key of Object.keys(state.completions)) {
        if (key.endsWith('_' + id)) delete state.completions[key];
      }
      saveState();
      render();
    }

    let tagCustomEmoji = null;

    function getTripFlag(text) {
      const lower = text.toLowerCase().trim();
      // Check longer phrases first
      for (const [key, flag] of Object.entries(COUNTRY_FLAGS)) {
        if (lower.includes(key)) return flag;
      }
      return '✈️';
    }

    function getEventEmoji(text) {
      const lower = text.toLowerCase().trim();
      for (const [key, emoji] of Object.entries(EVENT_EMOJIS)) {
        if (lower.includes(key)) return emoji;
      }
      return '📅';
    }

    function getDayTags(dateStr) {
      return state.dayTags[dateStr] || [];
    }

    function addDayTag(type, text) {
      if (!state.dayTags[selectedDate]) state.dayTags[selectedDate] = [];
      let emoji;
      if (tagCustomEmoji) {
        emoji = tagCustomEmoji;
      } else if (type === 'trip') emoji = getTripFlag(text);
      else if (type === 'event') emoji = getEventEmoji(text);
      else if (type === 'sick') emoji = '🤒';
      else emoji = '👤';
      state.dayTags[selectedDate].push({ type, text, emoji });
      tagCustomEmoji = null;
      saveState();
      render();
    }

    function removeDayTag(dateStr, index) {
      if (!state.dayTags[dateStr]) return;
      state.dayTags[dateStr].splice(index, 1);
      if (state.dayTags[dateStr].length === 0) delete state.dayTags[dateStr];
      saveState();
      render();
    }

    function renderDayTags() {
      const display = document.getElementById('dayTagsDisplay');
      const tags = getDayTags(selectedDate);
      display.innerHTML = '';

      tags.forEach((tag, i) => {
        const chip = document.createElement('span');
        chip.className = `day-tag-chip ${tag.type}`;
        chip.innerHTML = `${tag.emoji} ${escapeHtml(tag.text)} <button class="tag-remove" data-idx="${i}">&times;</button>`;
        display.appendChild(chip);
      });

      display.querySelectorAll('.tag-remove').forEach(btn => {
        btn.onclick = () => removeDayTag(selectedDate, parseInt(btn.dataset.idx));
      });

      // Mini tags in date nav
      const navTags = document.getElementById('dateNavTags');
      navTags.innerHTML = '';
      tags.forEach(tag => {
        const mini = document.createElement('span');
        mini.className = `mini-tag ${tag.type}`;
        mini.textContent = `${tag.emoji} ${tag.text}`;
        navTags.appendChild(mini);
      });
    }

    function openTagInput(type) {
      tagInputType = type;
      tagCustomEmoji = null;
      const row = document.getElementById('tagInputRow');
      const badge = document.getElementById('tagTypeBadge');
      const input = document.getElementById('tagTextInput');
      const emojiInput = document.getElementById('tagEmojiInput');

      row.classList.add('visible');
      emojiInput.style.display = 'none';

      if (type === 'trip') {
        badge.textContent = '✈️';
        input.placeholder = 'City or country...';
      } else if (type === 'event') {
        badge.textContent = '📅';
        input.placeholder = 'Event name...';
      } else if (type === 'person') {
        badge.textContent = '👤';
        input.placeholder = 'Person name...';
      } else if (type === 'sick') {
        badge.textContent = '🤒';
        input.placeholder = 'What\'s wrong? (optional)';
      }

      input.value = '';
      input.focus();

      // Live emoji update for trip/event (only if no custom emoji set)
      input.oninput = () => {
        if (tagCustomEmoji) return;
        if (type === 'trip') {
          badge.textContent = getTripFlag(input.value);
        } else if (type === 'event') {
          badge.textContent = getEventEmoji(input.value);
        }
      };

      // Click badge to open emoji edit (not for sick)
      badge.onclick = type !== 'sick' ? () => {
        emojiInput.style.display = '';
        emojiInput.value = '';
        emojiInput.focus();
      } : null;

      emojiInput.oninput = () => {
        // Extract first emoji/grapheme
        const val = [...emojiInput.value];
        if (val.length > 0) {
          const em = val[0];
          tagCustomEmoji = em;
          badge.textContent = em;
          emojiInput.style.display = 'none';
          input.focus();
        }
      };
    }

    function closeTagInput() {
      document.getElementById('tagInputRow').classList.remove('visible');
      document.getElementById('tagEmojiInput').style.display = 'none';
      tagInputType = null;
      tagCustomEmoji = null;
    }

    function saveTag() {
      const text = document.getElementById('tagTextInput').value.trim();
      if (!tagInputType) return;
      // Hidden toggle: typing "porn" in event input toggles no porn habit visibility
      if (tagInputType === 'event' && text.toLowerCase() === 'porn') {
        state.hidePorn = !state.hidePorn;
        saveState();
        closeTagInput();
        render();
        return;
      }
      if (!text && tagInputType !== 'sick') return;
      addDayTag(tagInputType, text);
      closeTagInput();
    }

    // --- Theme ---
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      document.getElementById('themeIcon').innerHTML = state.theme === 'dark' ? '&#9788;' : '&#9789;';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = state.theme === 'dark' ? '#1a1a1a' : '#f5f5f7';
    }

    // --- Init ---
    function init() {
      applyTheme();
      render();

      document.getElementById('themeToggle').onclick = () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState();
        applyTheme();
      };

      document.getElementById('signOutBtn').onclick = () => {
        if (confirm('Sign out? Your data stays in the cloud.')) doSignOut();
      };

      document.getElementById('prevDay').onclick = () => { selectedDate = dateAdd(selectedDate, -1); render(); };
      document.getElementById('nextDay').onclick = () => { selectedDate = dateAdd(selectedDate, 1); render(); };

      document.getElementById('showAddForm').onclick = () => {
        document.getElementById('addForm').classList.add('visible');
        document.getElementById('showAddForm').style.display = 'none';
        document.getElementById('habitNameInput').focus();
      };

      document.getElementById('cancelAdd').onclick = () => {
        document.getElementById('addForm').classList.remove('visible');
        document.getElementById('showAddForm').style.display = '';
        document.getElementById('habitNameInput').value = '';
        document.getElementById('habitIconInput').value = '';
      };

      document.getElementById('saveHabit').onclick = () => {
        const name = document.getElementById('habitNameInput').value.trim();
        const icon = document.getElementById('habitIconInput').value.trim() || '✅';
        if (!name) { document.getElementById('habitNameInput').focus(); return; }
        addHabit(icon, name);
        document.getElementById('habitNameInput').value = '';
        document.getElementById('habitIconInput').value = '';
        document.getElementById('addForm').classList.remove('visible');
        document.getElementById('showAddForm').style.display = '';
      };

      document.getElementById('habitNameInput').onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById('saveHabit').click();
      };

      document.getElementById('cancelEdit').onclick = closeEditModal;
      document.getElementById('saveEdit').onclick = saveEditedHabit;
      document.getElementById('editModal').onclick = (e) => {
        if (e.target === document.getElementById('editModal')) closeEditModal();
      };
      document.getElementById('editNameInput').onkeydown = (e) => {
        if (e.key === 'Enter') saveEditedHabit();
      };

      // Day tag buttons
      document.querySelectorAll('.tag-add-btn').forEach(btn => {
        btn.onclick = () => openTagInput(btn.dataset.type);
      });
      document.getElementById('tagSaveBtn').onclick = saveTag;
      document.getElementById('tagCancelBtn').onclick = closeTagInput;
      document.getElementById('tagTextInput').onkeydown = (e) => {
        if (e.key === 'Enter') saveTag();
        if (e.key === 'Escape') closeTagInput();
      };

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });

      // Month navigation
      document.getElementById('prevMonth').onclick = () => {
        if (!overviewMonth) initOverviewMonth();
        overviewMonth.month--;
        if (overviewMonth.month < 0) { overviewMonth.month = 11; overviewMonth.year--; }
        renderCalendar();
      };
      document.getElementById('nextMonth').onclick = () => {
        if (!overviewMonth) initOverviewMonth();
        overviewMonth.month++;
        if (overviewMonth.month > 11) { overviewMonth.month = 0; overviewMonth.year++; }
        renderCalendar();
      };

      // Year navigation
      document.getElementById('prevYear').onclick = () => {
        if (!overviewYear) initOverviewYear();
        overviewYear--;
        renderYear();
      };
      document.getElementById('nextYear').onclick = () => {
        if (!overviewYear) initOverviewYear();
        overviewYear++;
        renderYear();
      };

      document.onkeydown = (e) => {
        if (e.key === 'Escape') closeEditModal();
      };
    }

    bootstrap();

    // Generate apple-touch-icon dynamically
    (function generateAppIcon() {
      const c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      const ctx = c.getContext('2d');

      // Dark rounded rect background
      const r = 36;
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(180 - r, 0); ctx.quadraticCurveTo(180, 0, 180, r);
      ctx.lineTo(180, 180 - r); ctx.quadraticCurveTo(180, 180, 180 - r, 180);
      ctx.lineTo(r, 180); ctx.quadraticCurveTo(0, 180, 0, 180 - r);
      ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.fill();

      // "HT" text
      ctx.fillStyle = '#e0e0e0';
      ctx.font = "bold 78px -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HT', 90, 85);

      // Progress bar background
      ctx.fillStyle = '#444';
      ctx.beginPath();
      ctx.roundRect(26, 138, 128, 4, 2);
      ctx.fill();

      // Green progress
      ctx.fillStyle = '#34c759';
      ctx.beginPath();
      ctx.roundRect(26, 138, 85, 4, 2);
      ctx.fill();

      document.getElementById('appleTouchIcon').href = c.toDataURL('image/png');
    })();

    // Register service worker for PWA / offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
